<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="730" viewBox="0 0 1320 730" role="img" aria-labelledby="title desc">
  <title id="title">JobFit AI system architecture</title>
  <desc id="desc">A selected job page and local CV are processed by a Chrome extension. The extension sends a paired request to a Node.js API on localhost. The local API optionally calls Google Gemini with user consent, then returns deterministic matching and eligibility results to the extension.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity=".09"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
    <marker id="purple-arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6366f1"/>
    </marker>
  </defs>

  <rect width="1320" height="730" rx="24" fill="#f7f9fd"/>
  <text x="58" y="68" font-size="33" font-weight="750" fill="#0f172a" font-family="Arial, sans-serif">JobFit AI</text>
  <text x="58" y="103" font-size="18" fill="#64748b" font-family="Arial, sans-serif">Local-first Chrome extension • System architecture</text>
  <rect x="1086" y="43" width="174" height="34" rx="17" fill="#dcfce7"/>
  <circle cx="1109" cy="60" r="6" fill="#16a34a"/>
  <text x="1126" y="66" font-size="15" font-weight="700" fill="#166534" font-family="Arial, sans-serif">Personal use</text>

  <!-- User data -->
  <g filter="url(#shadow)">
    <rect x="46" y="180" width="244" height="120" rx="16" fill="#ffffff" stroke="#dbe3f1"/>
    <rect x="46" y="344" width="244" height="120" rx="16" fill="#ffffff" stroke="#dbe3f1"/>
  </g>
  <rect x="66" y="199" width="46" height="46" rx="12" fill="#eff6ff"/>
  <text x="89" y="231" text-anchor="middle" font-size="26" fill="#2563eb" font-family="Arial, sans-serif">⌕</text>
  <text x="124" y="222" font-size="19" font-weight="700" fill="#0f172a" font-family="Arial, sans-serif">Selected job</text>
  <text x="124" y="245" font-size="16" fill="#475569" font-family="Arial, sans-serif">Active Chrome tab</text>
  <text x="67" y="277" font-size="14" fill="#64748b" font-family="Arial, sans-serif">Only the selected vacancy</text>

  <rect x="66" y="363" width="46" height="46" rx="12" fill="#ecfdf5"/>
  <text x="89" y="394" text-anchor="middle" font-size="22" fill="#059669" font-family="Arial, sans-serif">CV</text>
  <text x="124" y="385" font-size="19" font-weight="700" fill="#0f172a" font-family="Arial, sans-serif">Resume</text>
  <text x="124" y="408" font-size="16" fill="#475569" font-family="Arial, sans-serif">PDF / DOCX</text>
  <text x="67" y="441" font-size="14" fill="#64748b" font-family="Arial, sans-serif">Parsed on the device</text>

  <!-- Extension -->
  <g filter="url(#shadow)"><rect x="350" y="157" width="285" height="329" rx="20" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/></g>
  <rect x="350" y="157" width="285" height="68" rx="20" fill="#eef2ff"/>
  <rect x="350" y="199" width="285" height="26" fill="#eef2ff"/>
  <text x="373" y="195" font-size="21" font-weight="750" fill="#3730a3" font-family="Arial, sans-serif">Chrome Extension</text>
  <text x="373" y="218" font-size="15" fill="#6366f1" font-family="Arial, sans-serif">WXT · React · TypeScript</text>
  <rect x="374" y="245" width="237" height="55" rx="11" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="392" y="267" font-size="16" font-weight="700" fill="#1e293b" font-family="Arial, sans-serif">Vacancy extractor</text>
  <text x="392" y="286" font-size="13" fill="#64748b" font-family="Arial, sans-serif">Selected-job validation</text>
  <rect x="374" y="315" width="237" height="55" rx="11" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="392" y="337" font-size="16" font-weight="700" fill="#1e293b" font-family="Arial, sans-serif">Local CV profile</text>
  <text x="392" y="356" font-size="13" fill="#64748b" font-family="Arial, sans-serif">chrome.storage.session</text>
  <rect x="374" y="385" width="237" height="73" rx="11" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="392" y="410" font-size="16" font-weight="700" fill="#166534" font-family="Arial, sans-serif">JobFit AI popup</text>
  <text x="392" y="430" font-size="13" fill="#166534" font-family="Arial, sans-serif">Match score · Eligibility</text>
  <text x="392" y="448" font-size="13" fill="#166534" font-family="Arial, sans-serif">Conditions · Cover letter</text>

  <!-- Local backend -->
  <g filter="url(#shadow)"><rect x="704" y="157" width="300" height="329" rx="20" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/></g>
  <rect x="704" y="157" width="300" height="68" rx="20" fill="#ccfbf1"/>
  <rect x="704" y="199" width="300" height="26" fill="#ccfbf1"/>
  <text x="728" y="195" font-size="21" font-weight="750" fill="#115e59" font-family="Arial, sans-serif">Local Node.js API</text>
  <text x="728" y="218" font-size="15" fill="#0f766e" font-family="Arial, sans-serif">127.0.0.1:8787</text>
  <rect x="728" y="245" width="252" height="55" rx="11" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="746" y="267" font-size="16" font-weight="700" fill="#1e293b" font-family="Arial, sans-serif">Pairing + Zod validation</text>
  <text x="746" y="286" font-size="13" fill="#64748b" font-family="Arial, sans-serif">Authenticated requests</text>
  <rect x="728" y="315" width="252" height="55" rx="11" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="746" y="337" font-size="16" font-weight="700" fill="#1e293b" font-family="Arial, sans-serif">Gemini gateway</text>
  <text x="746" y="356" font-size="13" fill="#64748b" font-family="Arial, sans-serif">DPAPI-protected key</text>
  <rect x="728" y="385" width="252" height="73" rx="11" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="746" y="410" font-size="16" font-weight="700" fill="#166534" font-family="Arial, sans-serif">TypeScript engines</text>
  <text x="746" y="430" font-size="13" fill="#166534" font-family="Arial, sans-serif">CV + skills matching</text>
  <text x="746" y="448" font-size="13" fill="#166534" font-family="Arial, sans-serif">Sri Lanka eligibility</text>

  <!-- Gemini -->
  <g filter="url(#shadow)"><rect x="1072" y="240" width="207" height="167" rx="20" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/></g>
  <circle cx="1110" cy="278" r="17" fill="#f3e8ff"/>
  <text x="1110" y="285" text-anchor="middle" font-size="24" fill="#7c3aed" font-family="Arial, sans-serif">✦</text>
  <text x="1138" y="284" font-size="21" font-weight="750" fill="#4c1d95" font-family="Arial, sans-serif">Gemini AI</text>
  <text x="1092" y="325" font-size="15" fill="#475569" font-family="Arial, sans-serif">Job interpretation</text>
  <text x="1092" y="350" font-size="15" fill="#475569" font-family="Arial, sans-serif">Cover letter generation</text>
  <rect x="1092" y="368" width="166" height="24" rx="12" fill="#f3e8ff"/>
  <text x="1175" y="384" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9" font-family="Arial, sans-serif">With user consent</text>

  <!-- Connectors -->
  <path d="M290 240 H350" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M290 404 H350" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M635 282 H704" fill="none" stroke="#6366f1" stroke-width="2.5" marker-end="url(#purple-arrow)"/>
  <text x="671" y="263" text-anchor="middle" font-size="12" font-weight="600" fill="#4f46e5" font-family="Arial, sans-serif">Paired</text>
  <path d="M1004 315 H1072" fill="none" stroke="#6366f1" stroke-width="2.5" marker-end="url(#purple-arrow)"/>
  <path d="M1072 344 H1004" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Output callout -->
  <rect x="350" y="555" width="654" height="88" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="5 5"/>
  <circle cx="390" cy="599" r="19" fill="#dcfce7"/>
  <path d="M381 599 L388 606 L400 591" fill="none" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="425" y="590" font-size="21" font-weight="750" fill="#0f172a" font-family="Arial, sans-serif">Decision-ready job summary</text>
  <text x="425" y="615" font-size="15" fill="#64748b" font-family="Arial, sans-serif">Eligibility first · CV fit · Skills · Working conditions · Cover letter</text>
  <path d="M853 486 V525 H676 V555" fill="none" stroke="#16a34a" stroke-width="2.6" marker-end="url(#arrow)"/>
  <text x="683" y="704" text-anchor="middle" font-size="13" fill="#94a3b8" font-family="Arial, sans-serif">No database • Session-only CV profile • Gemini key protected on Windows</text>
</svg>
